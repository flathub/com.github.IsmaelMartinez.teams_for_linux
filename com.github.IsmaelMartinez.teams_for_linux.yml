app-id: com.github.IsmaelMartinez.teams_for_linux
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: teams-for-linux
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gtk.Notifications
  - --talk-name=org.gnome.SessionManager
  # Electron 42 sets the taskbar badge through libunity, which only emits
  # LauncherEntry.Update after it has seen this name on the session bus. The
  # sandbox hides the name otherwise, so app.setBadgeCount silently does nothing.
  - --talk-name=com.canonical.Unity
  # Electron's powerMonitor watches PrepareForSleep on the system bus, so the
  # app's suspend/resume handlers never fire without this.
  - --system-talk-name=org.freedesktop.login1
  - --env=XDG_CURRENT_DESKTOP=Unity
  # required to fix cursor scaling on wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
rename-desktop-file: teams-for-linux.desktop
rename-icon: teams-for-linux
modules:
  # fido2 tools for auth.webauthn.enabled; the sandbox cannot reach the host ones
  - name: libcbor
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /lib/*.a
    sources:
      - type: git
        url: https://github.com/PJK/libcbor.git
        tag: v0.14.0
        commit: 6730c20ab487c0b4dc5fb3fea918937085355bac
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: libfido2
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TOOLS=ON
      - -DBUILD_TESTS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_MANPAGES=OFF
      - -DBUILD_STATIC_LIBS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
    sources:
      - type: git
        url: https://github.com/Yubico/libfido2.git
        tag: 1.17.0
        commit: b974e7cf2ee7392134cc12c08b76a068cf250dd8
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: teams-for-linux
    buildsystem: simple

    sources:
      - type: file
        dest-filename: teams-for-linux.deb
        only-arches: [x86_64]
        url: https://github.com/IsmaelMartinez/teams-for-linux/releases/download/v2.23.0/teams-for-linux_2.23.0_amd64.deb
        sha256: 7ec5b3b7d500c25c9a3315075db1ca3a96c7be3bb0f46f7f37044a0d7418d392
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/IsmaelMartinez/teams-for-linux/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: .assets | map(.browser_download_url | select(endswith("_amd64.deb"))) | first

      - type: file
        dest-filename: teams-for-linux.deb
        only-arches: [aarch64]
        url: https://github.com/IsmaelMartinez/teams-for-linux/releases/download/v2.23.0/teams-for-linux_2.23.0_arm64.deb
        sha256: f8a5c926946921c1f2a1b6e76cb8282a9235b4c570d0bca303516ce0553aecb6
        x-checker-data:
          type: json
          url: https://api.github.com/repos/IsmaelMartinez/teams-for-linux/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: .assets | map(.browser_download_url | select(endswith("_arm64.deb"))) | first

      - type: file
        dest-filename: com.github.IsmaelMartinez.teams_for_linux.metainfo.xml
        url: https://raw.githubusercontent.com/IsmaelMartinez/teams-for-linux/v2.23.0/com.github.IsmaelMartinez.teams_for_linux.appdata.xml
        sha256: 586a297f55db3e1435e30724fa2f7f3f9e77ead34d234c108404192f6efb8881
        x-checker-data:
          type: json
          url: https://api.github.com/repos/IsmaelMartinez/teams-for-linux/releases/latest
          tag-query: .tag_name
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://raw.githubusercontent.com/IsmaelMartinez/teams-for-linux/" + $tag + "/com.github.IsmaelMartinez.teams_for_linux.appdata.xml"'

      - type: script
        dest-filename: teams-for-linux.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/teams-for-linux/teams-for-linux "$@"

    build-commands:
      - ar x teams-for-linux.deb
      - rm -f teams-for-linux.deb
      - tar -xf data.tar.xz
      - rm -f control.tar.gz data.tar.xz debian-binary
      - cp -r opt/* usr/* $FLATPAK_DEST
      - rm -rf opt usr
      - install teams-for-linux.sh $FLATPAK_DEST/bin/teams-for-linux
      - install -D -m 644 -t $FLATPAK_DEST/share/metainfo $FLATPAK_ID.metainfo.xml
      - desktop-file-edit --set-key Exec --set-value "teams-for-linux %U" ${FLATPAK_DEST}/share/applications/teams-for-linux.desktop
      # patch-electron-desktop-filename below makes the app report the app id as its
      # X11 WM_CLASS, so the desktop entry has to match or docks cannot associate the
      # running window with its launcher
      - desktop-file-edit --set-key StartupWMClass --set-value "com.github.IsmaelMartinez.teams_for_linux" ${FLATPAK_DEST}/share/applications/teams-for-linux.desktop
      # required for wayland, cf. https://docs.flatpak.org/en/latest/electron.html#using-correct-desktop-file-name
      - patch-electron-desktop-filename ${FLATPAK_DEST}/teams-for-linux/resources/app.asar
      - rm -rf "${FLATPAK_DEST}/share/icons/hicolor/1024x1024/"
