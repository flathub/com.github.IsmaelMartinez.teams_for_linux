# This is the `beta` branch. Flathub builds it into the flathub-beta remote,
# separately from `master`, which feeds the stable remote.
#
# It exists because the app's release process publishes a pre-release first and
# promotes it to stable only after it has soaked. `master` tracks
# `releases/latest`, which by definition skips pre-releases, so without this
# branch Flatpak users can never test one. It is also where riskier packaging
# changes (sandbox permissions, wrapper flags) go for real-world testing, since
# the maintainer has no Linux desktop to verify them on.
#
# Bumping this branch is MANUAL. Flathub's hosted update checker only runs
# against a repo's default branch (`master`), so flathubbot never touches this
# one. The x-checker-data queries below describe what the branch should track,
# and would be correct if the checker were ever pointed at it, but nothing
# executes them today. The runbook is in the app repo, under
# docs-site/docs/development/manual-release-process.md ("Flathub beta branch").
#
# Keep every other change in sync with `master` unless it is deliberately
# under test here.
app-id: com.github.IsmaelMartinez.teams_for_linux
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: teams-for-linux
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gtk.Notifications
  - --talk-name=org.gnome.SessionManager
  # Electron's powerMonitor watches PrepareForSleep on the system bus, so the
  # app's suspend/resume handlers never fire without this.
  - --system-talk-name=org.freedesktop.login1
  - --env=XDG_CURRENT_DESKTOP=Unity
  # required to fix cursor scaling on wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
rename-desktop-file: teams-for-linux.desktop
rename-icon: teams-for-linux
modules:
  - name: teams-for-linux
    buildsystem: simple

    sources:
      - type: file
        dest-filename: teams-for-linux.deb
        only-arches: [x86_64]
        url: https://github.com/IsmaelMartinez/teams-for-linux/releases/download/v2.20.0/teams-for-linux_2.20.0_amd64.deb
        sha256: c2c727faff235a4901496f42d0e0348ea62ebe278074319b0f70757b457f426b
        x-checker-data:
          is-main-source: true
          type: json
          # The list endpoint, not /latest: /latest excludes pre-releases, which
          # are exactly what this branch is for. Entries come back newest first,
          # and drafts are filtered out explicitly rather than relying on the
          # API omitting them for unauthenticated callers.
          url: https://api.github.com/repos/IsmaelMartinez/teams-for-linux/releases
          version-query: '[.[] | select(.draft | not)][0].tag_name | sub("^v"; "")'
          timestamp-query: '[.[] | select(.draft | not)][0].published_at'
          url-query: '[.[] | select(.draft | not)][0].assets | map(.browser_download_url | select(endswith("_amd64.deb"))) | first'

      - type: file
        dest-filename: teams-for-linux.deb
        only-arches: [aarch64]
        url: https://github.com/IsmaelMartinez/teams-for-linux/releases/download/v2.20.0/teams-for-linux_2.20.0_arm64.deb
        sha256: 05496b5917ae4c51f0110563cba3e9de992494cb125e0f989b56489d62e311e9
        x-checker-data:
          type: json
          url: https://api.github.com/repos/IsmaelMartinez/teams-for-linux/releases
          version-query: '[.[] | select(.draft | not)][0].tag_name | sub("^v"; "")'
          timestamp-query: '[.[] | select(.draft | not)][0].published_at'
          url-query: '[.[] | select(.draft | not)][0].assets | map(.browser_download_url | select(endswith("_arm64.deb"))) | first'

      - type: file
        dest-filename: com.github.IsmaelMartinez.teams_for_linux.metainfo.xml
        url: https://raw.githubusercontent.com/IsmaelMartinez/teams-for-linux/v2.20.0/com.github.IsmaelMartinez.teams_for_linux.appdata.xml
        sha256: f611ccdfff02d076c64f1a6ab812509e0dde84347295ca4f95e4338ee7f7b409
        x-checker-data:
          type: json
          url: https://api.github.com/repos/IsmaelMartinez/teams-for-linux/releases
          tag-query: '[.[] | select(.draft | not)][0].tag_name'
          version-query: '[.[] | select(.draft | not)][0].tag_name | sub("^v"; "")'
          timestamp-query: '[.[] | select(.draft | not)][0].published_at'
          url-query: '"https://raw.githubusercontent.com/IsmaelMartinez/teams-for-linux/" + $tag + "/com.github.IsmaelMartinez.teams_for_linux.appdata.xml"'

      - type: script
        dest-filename: teams-for-linux.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/teams-for-linux/teams-for-linux "$@"

    build-commands:
      - ar x teams-for-linux.deb
      - rm -f teams-for-linux.deb
      - tar -xf data.tar.xz
      - rm -f control.tar.gz data.tar.xz debian-binary
      - cp -r opt/* usr/* $FLATPAK_DEST
      - rm -rf opt usr
      - install teams-for-linux.sh $FLATPAK_DEST/bin/teams-for-linux
      - install -D -m 644 -t $FLATPAK_DEST/share/metainfo $FLATPAK_ID.metainfo.xml
      - desktop-file-edit --set-key Exec --set-value "teams-for-linux %U" ${FLATPAK_DEST}/share/applications/teams-for-linux.desktop
      # patch-electron-desktop-filename below makes the app report the app id as its
      # X11 WM_CLASS, so the desktop entry has to match or docks cannot associate the
      # running window with its launcher
      - desktop-file-edit --set-key StartupWMClass --set-value "com.github.IsmaelMartinez.teams_for_linux" ${FLATPAK_DEST}/share/applications/teams-for-linux.desktop
      # required for wayland, cf. https://docs.flatpak.org/en/latest/electron.html#using-correct-desktop-file-name
      - patch-electron-desktop-filename ${FLATPAK_DEST}/teams-for-linux/resources/app.asar
      - rm -rf "${FLATPAK_DEST}/share/icons/hicolor/1024x1024/"
